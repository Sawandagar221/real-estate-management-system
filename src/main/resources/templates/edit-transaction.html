<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Transaction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f5f7fa;
        }
        form {
            max-width: 450px;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        label {
            display: block;
            margin-top: 15px;
        }
        input, select {
            width: 100%;
            padding: 9px;
            margin-top: 5px;
            box-sizing: border-box;
        }
        button {
            margin-top: 20px;
            padding: 10px 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>Edit Transaction</h1>

<form th:action="@{/transactions/edit/{id}(id=${transaction.transactionId})}"
      th:object="${transaction}" method="post">

    <label for="propertyId">Select Property:</label>
    <select id="propertyId" th:field="*{propertyId}" required>
        <option value="">-- Select Property --</option>
        <option th:each="p : ${properties}"
                th:value="${p.propertyId}"
                th:text="${p.title}"></option>
    </select>

    <label for="customerId">Select Customer:</label>
    <select id="customerId" th:field="*{customerId}" required>
        <option value="">-- Select Customer --</option>
        <option th:each="c : ${customers}"
                th:value="${c.customerId}"
                th:text="${c.name}"></option>
    </select>

    <label for="transactionType">Transaction Type:</label>
    <select id="transactionType" th:field="*{transactionType}" required>
        <option value="Sale">Sale</option>
        <option value="Rent">Rent</option>
    </select>

    <label for="amount">Amount:</label>
    <input type="number" id="amount" th:field="*{amount}"
           min="0.01" step="0.01" required>

    <label for="transactionDate">Transaction Date:</label>
    <input type="date" id="transactionDate"
           th:field="*{transactionDate}" required>

    <button type="submit">Update Transaction</button>
</form>

<p><a href="/transactions">Cancel and Go Back</a></p>

</body>
</html>
