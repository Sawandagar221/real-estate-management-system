<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f4f6f8;
        }
        h1 {
            color: #243b53;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background: #243b53;
            color: white;
        }
        /* Professional Edit and Delete buttons */
        .action-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }

        .btn-edit,
        .btn-delete {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 9px 14px;
            border: none;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-edit {
            background-color: #e8efff;
            color: #2458c6;
            border: 1px solid #cbdafe;
        }

        .btn-edit:hover {
            background-color: #2458c6;
            color: #ffffff;
            box-shadow: 0 3px 8px rgba(36, 88, 198, 0.2);
            transform: translateY(-1px);
        }

        .delete-form {
            display: inline-flex;
            margin: 0;
        }

        .btn-delete {
            background-color: #fff0f0;
            color: #c62828;
            border: 1px solid #ffd1d1;
        }

        .btn-delete:hover {
            background-color: #c62828;
            color: #ffffff;
            box-shadow: 0 3px 8px rgba(198, 40, 40, 0.2);
            transform: translateY(-1px);
        }

        .btn-edit:focus-visible,
        .btn-delete:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 2px;
        }

        @media (max-width: 600px) {
            .action-buttons {
                gap: 6px;
            }

            .btn-edit,
            .btn-delete {
                padding: 8px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

<h1>Real Estate Management System</h1>
<h2>Property List</h2>

<style>
    .filter-box {
        background: white;
        padding: 20px;
        margin: 20px 0;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .filter-box input,
    .filter-box select {
        padding: 10px;
        margin: 5px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
    }

    .filter-box button,
    .reset-button {
        display: inline-block;
        padding: 10px 16px;
        margin: 5px;
        background: #243b53;
        color: white;
        border: none;
        border-radius: 6px;
        text-decoration: none;
        cursor: pointer;
    }

    .reset-button {
        background: #64748b;
    }
</style>

<div class="filter-box">
    <h3>Search & Filter Properties</h3>
    <a th:href="@{/properties/add}"
       style="display:inline-block; margin:15px 0;
          padding:10px 18px; background-color:#243b53;
          color:white; text-decoration:none; border-radius:5px;">
        + Add Property
    </a>
    <form th:action="@{/properties}" method="get">

        <input type="text"
               name="keyword"
               placeholder="Search title or location..."
               th:value="${keyword}">

        <select name="propertyType">
            <option value="">All Property Types</option>
            <option value="House"
                    th:selected="${selectedType == 'House'}">House</option>
            <option value="Apartment"
                    th:selected="${selectedType == 'Apartment'}">Apartment</option>
            <option value="Land"
                    th:selected="${selectedType == 'Land'}">Land</option>
            <option value="Commercial"
                    th:selected="${selectedType == 'Commercial'}">Commercial</option>
        </select>

        <select name="status">
            <option value="">All Statuses</option>
            <option value="Available"
                    th:selected="${selectedStatus == 'Available'}">Available</option>
            <option value="Sold"
                    th:selected="${selectedStatus == 'Sold'}">Sold</option>
            <option value="Rented"
                    th:selected="${selectedStatus == 'Rented'}">Rented</option>
        </select>

        <button type="submit">Search / Filter</button>

        <a th:href="@{/properties}" class="reset-button">Reset</a>

    </form>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Type</th>
        <th>Location</th>
        <th>Price</th>
        <th>Status</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="property : ${properties}">
        <td th:text="${property.propertyId}"></td>
        <td th:text="${property.title}"></td>
        <td th:text="${property.propertyType}"></td>
        <td th:text="${property.location}"></td>
        <td th:text="${property.price}"></td>
        <td th:text="${property.status}"></td>
        <td>
            <div class="action-buttons">

                <a class="btn-edit"
                   th:href="@{/properties/edit/{id}(id=${property.propertyId})}">
                    ✏️ Edit
                </a>

                <form th:action="@{/properties/delete/{id}(id=${property.propertyId})}"
                      method="post"
                      class="delete-form"
                      onsubmit="return confirm('Are you sure you want to delete this property? This action cannot be undone.');">

                    <button type="submit" class="btn-delete">
                        🗑️ Delete
                    </button>
                </form>

            </div>
        </td>
    </tr>
    </tbody>
</table>
<!-- Pagination Controls -->
<div style="margin-top: 20px; text-align: center;">

    <p>
        Total properties:
        <strong th:text="${totalProperties}">0</strong>
    </p>

    <span th:if="${totalPages > 0}">

        <!-- Previous Button -->
        <a th:if="${currentPage > 0}"
           th:href="@{/properties(page=${currentPage - 1}, keyword=${keyword}, propertyType=${selectedType}, status=${selectedStatus})}"
           style="padding: 8px 12px; background: #243b53; color: white;
                  text-decoration: none; border-radius: 5px;">
            Previous
        </a>

        <!-- Page Numbers -->
        <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
              style="margin: 0 5px;">

            <a th:href="@{/properties(page=${i}, keyword=${keyword}, propertyType=${selectedType}, status=${selectedStatus})}"
               th:text="${i + 1}"
               th:style="${i == currentPage} ?
                   'padding: 8px 12px; background: #16a34a; color: white; text-decoration: none; border-radius: 5px;' :
                   'padding: 8px 12px; background: #e2e8f0; color: #243b53; text-decoration: none; border-radius: 5px;'">
            </a>

        </span>

        <!-- Next Button -->
        <a th:if="${currentPage < totalPages - 1}"
           th:href="@{/properties(page=${currentPage + 1}, keyword=${keyword}, propertyType=${selectedType}, status=${selectedStatus})}"
           style="padding: 8px 12px; background: #243b53; color: white;
                  text-decoration: none; border-radius: 5px;">
            Next
        </a>

    </span>

    <p th:if="${totalPages == 0}">
        No properties found.
    </p>

</div>
</body>
</html>
