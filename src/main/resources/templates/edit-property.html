<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Property - Real Estate Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 550px;
            margin: 30px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
            color: #334155;
        }

        input, select {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #2563eb;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
<div class="container">
    <h2>Edit Property</h2>

    <form th:action="@{/properties/edit/{id}(id=${property.propertyId})}"
          th:object="${property}"
          method="post">

        <label for="title">Title:</label>
        <input type="text"
               id="title"
               th:field="*{title}"
               minlength="3"
               maxlength="100"
               pattern=".*\S.*"
               title="Enter a title with at least 3 characters."
               required>

        <label for="propertyType">Property Type:</label>
        <select id="propertyType" th:field="*{propertyType}" required>
            <option value="">Select Property Type</option>
            <option value="Flat">Flat</option>
            <option value="House">House</option>
            <option value="Plot">Plot</option>
            <option value="Commercial">Commercial</option>
        </select>

        <label for="location">Location:</label>
        <input type="text"
               id="location"
               th:field="*{location}"
               minlength="3"
               maxlength="150"
               pattern=".*\S.*"
               title="Enter a location with at least 3 characters."
               required>

        <label for="price">Price (₹):</label>
        <input type="number"
               id="price"
               th:field="*{price}"
               min="0.01"
               step="0.01"
               required>

        <label for="status">Status:</label>
        <select id="status" th:field="*{status}" required>
            <option value="Available">Available</option>
            <option value="Sold">Sold</option>
            <option value="Rented">Rented</option>
        </select>

        <button type="submit">Update Property</button>
    </form>

    <a class="back-link" th:href="@{/dashboard}">
        ← Back to Dashboard
    </a>
</div>
</body>
</html>
